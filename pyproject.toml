[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hpo-bench"
version = "0.1.0"
description = "RAG HPO Bench - Hyperparameter Optimization Benchmarking for RAG Systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Matan Orbach", email = "matano@il.ibm.com"}
]
keywords = ["RAG", "hyperparameter optimization", "benchmarking", "retrieval augmented generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "datasets>=2.14.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/IBM/rag-hpo-bench"
Repository = "https://github.com/IBM/rag-hpo-bench"
Documentation = "https://github.com/IBM/rag-hpo-bench/blob/main/README.md"
"Bug Tracker" = "https://github.com/IBM/rag-hpo-bench/issues"
"Paper" = "https://arxiv.org/abs/2505.03452"
"Dataset" = "https://huggingface.co/datasets/ibm-research/rag-hpo-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_hpo_bench = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]